<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://fdbrxglmjoiwlutcelxb.supabase.co wss://fdbrxglmjoiwlutcelxb.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0a0a0b">
<title>Samir Barbearia· Agende seu horário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/agendamento.css">
</head>
<body>

<!-- ===================== SITE DO CLIENTE ===================== -->
<div id="client-view">
  <header class="hero">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg></div>
    <h1  class="brand">Samir Barbearia</h1>
    <p class="tagline">Estilo, precisão e tradição. Agende seu horário.</p>
  </header>
  <main class="container">
    <section class="step active" id="step-service">
      <div class="step-head"><div class="num">1</div><h2>Escolha o serviço</h2></div>
      <div class="services" id="services"></div>
    </section>
    <section class="step locked" id="step-date">
      <div class="step-head"><div class="num">2</div><h2>Escolha o dia</h2></div>
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="Mês anterior">‹</button>
        <div class="cal-title" id="cal-title"></div>
        <button class="cal-nav" id="cal-next" aria-label="Próximo mês">›</button>
      </div>
      <div class="cal-grid" id="cal-dow"></div>
      <div class="cal-grid" id="cal-days" style="margin-top:6px"></div>
    </section>
    <section class="step locked" id="step-time">
      <div class="step-head"><div class="num">3</div><h2>Escolha o horário</h2></div>
      <div class="day-label" id="slots-info"></div>
      <div class="slots" id="slots"></div>
    </section>
    <section class="step locked" id="step-info">
      <div class="step-head"><div class="num">4</div><h2>Seus dados</h2></div>
      <form id="form" novalidate>
        <div class="summary" id="summary"></div>
        <div class="field"><label for="name">Nome</label><input class="input" id="name" type="text" autocomplete="name" placeholder="Seu nome" maxlength="80"></div>
        <div class="field"><label for="phone">Telefone (WhatsApp)</label><input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(65) 99999-9999" maxlength="16"></div>
        <button class="btn btn-gold" id="submit" type="submit">Confirmar agendamento</button>
      </form>
    </section>
  </main>
  <footer>  © Samir Barbearia · <a href="admin.html">Área do barbeiro</a></footer>

  <a class="wa-float" id="wa-float" href="#" target="_blank" rel="noopener" aria-label="Falar com o Samir no WhatsApp" title="Falar no WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <div class="modal-back hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal">
  <button class="modal-x" id="modal-x" type="button" aria-label="Fechar">×</button>
  <div class="check">
      <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>Horário confirmado!</h2>
      <p>Te esperamos na Samir Barbearia.</p>
      <div class="receipt" id="receipt"></div>
      <div class="stack">
        <a class="btn btn-wa" id="wa-btn" href="#" target="_blank" rel="noopener">Avisar o Samir no WhatsApp</a>
        <button class="btn btn-out" id="new-booking" type="button">Fazer novo agendamento</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/agendamento.js"></script>
</body>
</html>
